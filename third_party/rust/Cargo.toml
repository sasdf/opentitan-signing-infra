[package]
name = "rust_opentitan_signing_crates"
version = "0.0.0"
license = "Apache-2.0"
publish = false

[lib]
path = "fake.rs"

# Please avoid version numbers that only have one component.
[dependencies]
anyhow = { version = "1.0.57", features=["backtrace"] }
asn1 = "0.22"
bitflags = { version = "2.1", features = ["serde"] }
clap = { version = "4.5.47", features = ["derive", "env", "deprecated"] }
crc = "3.0"
cryptoki = "0.12.0"
cryptoki-sys = "0.5.0"
directories = "6.0"
env_logger = "0.11"
erased-serde = "0.4"
hex = { version = "0.4.3", features = ["serde"] }
indexmap = { version = "2.0", features = ["serde"] }
libloading = "0.8"
log = "0.4"
openssl = "0.10.64"
pastey = "0.2.3"
rand = "0.8.4"
regex = "1.7"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1.0.188", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0.69"
strum = { version = "0.27", features = ["derive"] }
thiserror = "2.0"
typetag = "0.2"
zeroize = "1.8.1"

# disable default `default-tls` feature and use `rustls-tls` to avoid a dependency on OpenSSL
reqwest = { version = "0.12.9", default-features = false, features = ["charset", "http2", "rustls-tls", "blocking", "json"] }

# RustCrypto crates
base64ct = "1.6.0"
der = { version = "0.7.8", features = ["alloc"] }
ecdsa = { version = "0.16.9", features = ["pkcs8", "pem", "signing", "verifying", "sha2", "std"] }
ml-dsa = "0.0.4"
p256 = "0.13.2"
pem-rfc7468 = { version = "0.7.0", features = ["alloc", "std"] }
pkcs8 = { version = "0.10", features = ["std"] }
rsa = "0.9.7"
sha2 = { version = "0.10", features = ["oid"] }
slh-dsa = "0.0.3"
signature = "2.0"
spki = "0.7"
x509-cert = { version = "0.2.5", features = ["builder"] }

# Note: this is only used to enable `std` feature of `const-oid`, which
# is a dependency of RustCrypto crates. The version cannot be upgraded because
# it needs to match other crates.
const-oid = { version = "0.9.6", features=["std"] }

# FIXME: `generic-array` is a transitive dependency of e.g. `p256`. Without pinning this version,
# it will pull in 0.14.9 which deprecates methods which causes clippy lint warnings. Consider
# upgrading this to >=1.0.0 (& any dependencies that use it as necessary) in the future and
# making appropriate changes to resolve this pin.
generic-array = { version = "=0.14.7" }

# Ideally we'd reference `serde_annotate` via its Git repo - as is commented out below - but
# we also need to support airgapped builds, and Bazel does not support git repo references
# for airgapped builds. As such, these llibraries are downloaded as `http_archive` dependencies
# instead. In order to have a globally consistent set of crate dependencies, we must therefore
# enumerate the additional dependencies of those crates here. We create our own
# `@rust_opentitan_signing_crates` repo which is shared globally with the Bazel sub-repositories.
#
# serde_annotate = { git = "https://github.com/lowRISC/serde-annotate", branch="main"}
anstyle = "1.0"
num-traits = "0.2.14"
once_cell = "1.17"
pest = "2.2"
pest_derive = "2.2"
proc-macro2 = "1.0.45"
quote = "1.0"
scopeguard = "1.2"
syn = "2.0"
